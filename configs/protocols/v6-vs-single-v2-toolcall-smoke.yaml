# Smoke protocol: structured-v6 (A) vs single-v2 (B) on five dev-13 tasks.
# Not promotion eligible. One repeat. About 1–1.5 GPU hours:
# 5 tasks x 2 arms x 4.5 min cap, plus model load, inside a 90 minute session.
# configs/protocols/v5-vs-single-v1.yaml and v6-vs-single-v2.yaml are not this file.
# Do not edit those protocols or agents/*.
#
# Task ids are the dev-13 cohort ids in configs/cohorts/dev-13-environment-screened.json
# (fastapi_14786, not fastapi__fastapi-14786). The '__' form is only the trace
# filename encoding when an id contains '/'. None of these five contain '/'.
# All five are in the dev partition of configs/splits/public-v1.json.
#
# Included, in schedule order:
# 1. fastapi_14786: A lost it to a skill-format loop (46 of 46 skill calls failed,
#    file never read); B resolved it. Best signal for the skill-call fix.
# 2. rich_3934: A had 16 consecutive skill-format failures; B had 25 consecutive
#    failed edit_file calls with the leaked delimiter and falsely said Fixed.
#    Covers the skill fix and the edit_file fallback.
# 3. fastapi_11194: B had 25 consecutive skill failures; A produced only a scratch
#    repro.py. Solved by other runs.
# 4. rich_3938: A had a 12-failure skill streak, then cap; B ended with a
#    scratch-only patch (repro_soft_wrap.py).
# 5. fastapi_14262: A had 3 milder edit_file / leaked-delimiter failures; B read
#    about 30 files with no edit. Covers the edit fallback and the call-30 rule.
#
# Excluded on purpose: fastapi_14356 (unsolvable here, dirty_equals missing);
# rich_3105 (legitimate issue-number-only UNCERTAIN); rich_3472, rich_3944, and
# fastapi_14246 (exploration or give-up without a format-failure loop; 14246 only
# has early format failures and then probes); fastapi_14794 and rich_3454
# (controls; 14786 is already the solved-by-B contrast).
purpose: smoke
arms:
  A:
    source: agents/structured-v6
    expected_sha256: null
  B:
    source: agents/single-v2
    expected_sha256: null
allow_identical: false
allowed_differences:
  - agent.yaml
  - sub_agents/*
  - skills/*
  - prompts/*
cohort:
  path: configs/cohorts/dev-13-environment-screened.json
  task_file_sha256: e4b3fd60f69dbc2b9213e54eeb9636db78aefe92c1d06269d73d9f5f8f3c8ad6
task_ids:
  - fastapi_14786
  - rich_3934
  - fastapi_11194
  - rich_3938
  - fastapi_14262
repeats: 1
order_rule: per_task_parity_v1
shuffle_seed: null
session_budget_seconds: 5400
pair_start_pad_seconds: 60
abort_policy: round2_v1
early_stop: null
budget_gate:
  block:
    - name: round2_load_plus_129_mean
      formula: L + 129 * mean_wall
      threshold_seconds: 38880
    - name: coordinator_mean_times_120
      formula: mean_wall * 120
      threshold_seconds: 39600
  warn:
    - name: worst_case_12h
      formula: L + n * (cap + p90_delta)
      threshold_seconds: 43200
      n_values: [120, 129]
  L_default: 900
  coordinator_hours: 11
timing_tier: 2
pins_mode: record
exclude_import_origin_risk: true
