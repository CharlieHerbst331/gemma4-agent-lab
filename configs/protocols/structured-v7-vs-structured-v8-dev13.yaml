# Dev-13 comparison: structured-v7 (A) vs structured-v8 (B), one repeat.
# Not a smoke. Arm B unrolls the repair/verify loop into three shrinking
# rounds and uses a 300 second cap, 220 calls, and 320 turns. Arm A stays
# at 360 seconds, 150 calls, and 200 turns. matched_pair is false.
# Sampling tuples match (repair thinks at 256; other roles are off), so the
# budget marker is the one the checker requires. sampling.yaml and
# thinking.yaml are listed because a later prompt edit must not hide a
# sampling change. Schedule hashes are not required to be unique, so this
# hash matches the other one-repeat dev-13 protocols.
arms:
  A:
    source: agents/structured-v7
    expected_sha256: a3a08b179fee800ee0575af2a55ad14f47c42c369bf32fd4d52227a9da1109df
  B:
    source: agents/structured-v8
    expected_sha256: 34a9353d7504ec93d9d2237f1c1793f215e8e7d44ce3166190c203d645ff5936
matched_pair: false
notes: "Unmatched pair. Arm B is triage plus three repair/verify rounds, with thinking on for repair only, a 300 second cap, 220 calls, and 320 turns. Arm A is the structured-v7 loop at 360 seconds. eval_config.yaml is the budget marker."
allow_identical: false
allowed_differences:
  - agent.yaml
  - sub_agents/*
  - skills/*
  - prompts/*
  - eval_config.yaml
  - sampling.yaml
  - thinking.yaml
cohort:
  path: configs/cohorts/dev-13-environment-screened.json
  task_file_sha256: e4b3fd60f69dbc2b9213e54eeb9636db78aefe92c1d06269d73d9f5f8f3c8ad6
repeats: 1
order_rule: per_task_parity_v1
shuffle_seed: null
session_budget_seconds: 40200
pair_start_pad_seconds: 60
abort_policy: round2_v1
early_stop: null
budget_gate:
  block:
    - name: round2_load_plus_129_mean
      formula: L + 129 * mean_wall
      threshold_seconds: 38880
    - name: coordinator_mean_times_120
      formula: mean_wall * 120
      threshold_seconds: 39600
  warn:
    - name: worst_case_12h
      formula: L + n * (cap + p90_delta)
      threshold_seconds: 43200
      n_values: [120, 129]
  L_default: 900
  coordinator_hours: 11
timing_tier: 2
pins_mode: record
exclude_import_origin_risk: true
