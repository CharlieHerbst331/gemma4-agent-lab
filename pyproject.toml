[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma4-agent-lab"
version = "0.1.0"
description = "Reproducible Gemma 4 coding-agent experiments and Kaggle submission operations"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3", "requests>=2.32", "kaggle==2.2.4"]

[project.scripts]
gemma-lab = "gemma_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The notebook runtime is copied verbatim and keeps its own stdlib imports.
"src/gemma_lab/paired.py" = ["I001"]
# Official starter cells plus the embedded archive. gemma-lab notebook emits them.
"notebooks/structured-v16-1-dev13/evaluation.ipynb" = ["E401", "E402", "E501", "F401", "I001"]
"notebooks/structured-v16-2-dev13/evaluation.ipynb" = ["E401", "E402", "E501", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not stub_server'"
markers = [
  "stub_server: opt-in paired run against a stub model server and swegemma's mock repo",
]
