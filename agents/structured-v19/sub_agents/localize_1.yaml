agent_class: LlmAgent
name: localize_1
model: gemma-4-31b-it-qat-w4a16-ct
description: At most 4 tool calls, then one HYPOTHESIS line. No edits. No run_command. No loop.
instruction: !include localize_1.md
generate_content_config:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  # Hard cap. 256 fits one read_file call or the two-line report.
  max_output_tokens: 256
  thinking_config: !include thinking.yaml
  stop_sequences:
  - END_LOCALIZE
tools:
- get_status
- read_file
include_contents: default
output_key: localize_1_report
