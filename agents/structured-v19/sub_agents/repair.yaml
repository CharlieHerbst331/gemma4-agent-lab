agent_class: LlmAgent
name: repair
model: gemma-4-31b-it-qat-w4a16-ct
description: One repair from the failing test, or skip. Restores the best diff. Then submits.
instruction: !include repair.md
generate_content_config:
  temperature: 0.6
  top_p: 0.95
  top_k: 64
  max_output_tokens: 2048
  thinking_config: !include repair_thinking.yaml
  stop_sequences:
  - END_REPAIR
tools:
- get_status
- run_command
- submit_patch
include_contents: default
output_key: repair_report
skills:
- skills/force-heredoc
