agent_class: LlmAgent
name: triage
model: gemma-4-31b-it-qat-w4a16-ct
description: Name at most three candidate files from the issue and layout, then stop.
instruction: !include triage.md
generate_content_config:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  # Hard cap. 384 tokens is enough for the brief and ends the role sooner.
  max_output_tokens: 384
  thinking_config: !include thinking.yaml
include_contents: default
tools: []
output_key: triage_brief
