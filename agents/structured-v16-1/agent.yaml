agent_class: SequentialAgent
name: structured_v16_1
description: Triage, then three repair and verify rounds. Repair round 1 is one pass and hands off at 120 seconds. The last verify submits at 200 seconds. Only the last verify can submit.
sub_agents:
- config_path: sub_agents/triage.yaml
- config_path: sub_agents/repair_1.yaml
- config_path: sub_agents/verify_1.yaml
- config_path: sub_agents/repair_2.yaml
- config_path: sub_agents/verify_2.yaml
- config_path: sub_agents/repair_3.yaml
- config_path: sub_agents/verify_3.yaml
