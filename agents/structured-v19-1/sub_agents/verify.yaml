agent_class: LlmAgent
name: verify
model: gemma-4-31b-it-qat-w4a16-ct
description: Grep for one real test file, run it once under timeout 40, snapshot the diff.
instruction: !include verify.md
generate_content_config:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  max_output_tokens: 512
  thinking_config: !include thinking.yaml
  stop_sequences:
  - END_VERIFY
tools:
- get_status
- run_command
include_contents: default
output_key: verify_report
