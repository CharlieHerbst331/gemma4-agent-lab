agent_class: SequentialAgent
name: structured_v18
description: Triage, localize (no run_command), forced patch loops (no read tools), then verify. Only verify_3 can submit. Empty-diff time escapes removed from patch roles.
sub_agents:
- config_path: sub_agents/triage.yaml
- config_path: sub_agents/localize_1.yaml
- config_path: sub_agents/patch_1_loop.yaml
- config_path: sub_agents/verify_1.yaml
- config_path: sub_agents/patch_2_loop.yaml
- config_path: sub_agents/verify_2.yaml
- config_path: sub_agents/patch_3.yaml
- config_path: sub_agents/verify_3.yaml
