evaluation:
  # 5.5 minutes = 330 seconds. The harness reads max_time_minutes.
  # 150 counted calls and 200 turns are loose on purpose. The 330 s clock is
  # the failsafe. timeout_seconds is the per-command ceiling; remaining task
  # time lowers it further.
  timeout_seconds: 300
  max_tool_calls: 150
  max_time_minutes: 5.5
  max_turns: 200
