evaluation:
  # 4.5 minutes = 270 seconds. The harness reads max_time_minutes.
  # 48 counted calls is inside the 40-60 band. Skill script runs count as
  # tool calls, so turns and calls are roughly co-binding. The 270s clock
  # usually binds first. get_status reports max_turns but never turns used.
  # timeout_seconds is the per-command ceiling; remaining task time lowers it.
  timeout_seconds: 300
  max_tool_calls: 48
  max_time_minutes: 4.5
  max_turns: 64
