evaluation:
  # 4.5 minutes = 270 seconds. The harness reads max_time_minutes.
  # 48 counted calls is inside the 40-60 band. 48 turns matches that cap so
  # neither limit is far tighter than the other. The 270s clock is the intended
  # bound. timeout_seconds is the per-command ceiling; remaining task time
  # lowers it further.
  timeout_seconds: 300
  max_tool_calls: 48
  max_time_minutes: 4.5
  max_turns: 48
