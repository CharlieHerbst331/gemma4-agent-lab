agent_class: LlmAgent
name: repair_a
model: gemma-4-31b-it-qat-w4a16-ct
description: Repro-first repair in /tmp/cand_a. The first compiling edit is also applied to the real repo.
instruction: !include repair_a.md
generate_content_config:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  max_output_tokens: 2048
  seed: 101
  thinking_config: !include repair_thinking.yaml
tools:
- get_status
- read_file
- run_command
- search_similar_code
- get_code_neighbors
- get_code_subgraph
include_contents: default
output_key: repair_a_status
