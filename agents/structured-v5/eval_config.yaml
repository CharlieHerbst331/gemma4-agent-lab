evaluation:
  # 4.5 minutes = 270 seconds. The harness reads max_time_minutes.
  # 48 counted calls is inside the 40-60 band and is the binding call cap.
  # 64 turns is looser on purpose: get_status, submit_patch, skill loads, and
  # text replies cost turns but not counted calls, and get_status never reports
  # turns used. The 270s clock is the intended time bound. timeout_seconds is
  # the per-command ceiling; remaining task time lowers it further.
  timeout_seconds: 300
  max_tool_calls: 48
  max_time_minutes: 4.5
  max_turns: 64
