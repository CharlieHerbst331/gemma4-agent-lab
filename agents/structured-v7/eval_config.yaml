evaluation:
  # 6 minutes = 360 seconds. The harness reads max_time_minutes.
  # 150 counted calls and 200 turns match single-v8. The 360 s clock is the
  # failsafe. timeout_seconds is the per-command ceiling; remaining task time
  # lowers it further. The cap warns on the 12 hour formula and does not block.
  timeout_seconds: 300
  max_tool_calls: 150
  max_time_minutes: 6
  max_turns: 200
