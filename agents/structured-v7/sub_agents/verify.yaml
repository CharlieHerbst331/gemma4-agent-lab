agent_class: LlmAgent
name: verify
model: gemma-4-31b-it-qat-w4a16-ct
description: Check the workspace copy, reject an empty diff, and submit.
instruction: !include verify.md
generate_content_config:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
