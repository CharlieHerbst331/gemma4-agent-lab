agent_class: LlmAgent
name: investigator
model: gemma-4-31b-it-qat-w4a16-ct
description: Investigate one supplied hypothesis, optionally reproduce and make the authorized minimal repair. Return evidence, changed paths, and exact verification commands.
instruction: !include investigator.md
generate_content_config:
  temperature: 0.5
  top_p: 0.95
  max_output_tokens: 4096
  thinking_config:
    thinking_budget: 2048
    include_thoughts: true
tools:
  - read_file
  - edit_file
  - write_file
  - run_command
  - get_status
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
