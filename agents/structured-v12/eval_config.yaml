evaluation:
  # 260 seconds, not 270. max_time_minutes 4.5 is legal and is 270 seconds.
  # 120 * (270 + 70) = 40800, which misses the 39600 block. 120 * (260 + 70)
  # = 39600, so a cap-hit mean still passes that block. The 12 hour warning
  # still fires. Submit when the elapsed line is 215 (260 - 45).
  # timeout_seconds matches the cap so one command cannot outlive the task.
  # 220 counted calls and 320 turns stay at the v8 values. The clock binds.
  timeout_seconds: 260
  max_tool_calls: 220
  max_time_minutes: 4.333333333333333
  max_turns: 320
